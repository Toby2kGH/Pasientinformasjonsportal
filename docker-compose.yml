version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kreftinfo
      POSTGRES_PASSWORD: kreftinfo
      POSTGRES_DB: kreftinfo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreftinfo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
