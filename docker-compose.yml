# Database for lokal demo. Porten er bare tilgjengelig fra egen maskin (127.0.0.1).
# For nasjonal drift trengs blant annet connection pooling (f.eks. PgBouncer),
# sikkerhetskopi og egne passord. Det er bevisst holdt utenfor demoen.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kreftinfo
      POSTGRES_PASSWORD: kreftinfo
      POSTGRES_DB: kreftinfo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreftinfo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
